# ============================================================
# SIGNATURE VALUES
# ============================================================

signatureValues:

  - id: outcome-driven-delivery
    number: "01"
    label: Outcome-Driven Engineering Delivery
    shortLabel: Outcome-Driven Delivery
    statement: >
      Turns engineering effort into measurable results through disciplined
      execution, quality improvement, and practical delivery.
    components: [execution, quality, validation, delivery]
    evidence:
      - Continental — Customer-found defect reduction, 140+ to 5 within three years
      - Intel — Logged defect reduction, 12 to 4 per week within two years

  - id: human-centered-talent
    number: "02"
    label: Human-Centered Talent Development
    shortLabel: Talent Development
    statement: >
      Develops people through practical leadership, coaching, ownership, and
      opportunities to grow into stronger technical and organizational roles.
    components: [people, coaching, ownership, organization]
    evidence:
      - Intel — Engineer capability development, from non-performing to key
        contributor within one year
      - Continental — Engineer career development, from validation engineer to
        global Project Manager within three years

  - id: ai-augmented-engineering
    number: "03"
    label: AI-Augmented Engineering & Rapid Prototyping
    shortLabel: AI-Augmented Prototyping
    statement: >
      Uses AI as an engineering accelerator to prototype solutions, test
      hypotheses, and validate results.
    components: [ai, prototyping, hypotheses, validation]
    evidence:
      - Intel — GMSL2 camera driver enablement for next-generation platform
        within five days
      - Intel — Video colour-corruption detection algorithm innovation within
        a quarter
      - Intel — Video-tearing detection algorithm innovation within a quarter
      - Intel — Automation of 85 manual test cases validated in product
        milestones within two quarters

  - id: cross-functional-leadership
    number: "04"
    label: Cross-Functional Technical Leadership
    shortLabel: Technical Leadership
    statement: >
      Connects engineering, programs, customers, validation, and organizational
      priorities to move complex technical work toward delivery.
    components: [engineering, programs, customers, validation, organization]
    evidence:
      - Continental — Functional Test Site Lead and Business Owner for Penang
      - Blaupunkt — Cross-functional delivery across customer, R&D, procurement,
        manufacturing, and validation
      - Intel — Software team leadership across Media and Imaging
      - Intel — Validation team leadership across Media, Imaging, and SR-IOV

# ============================================================
# BUSINESS COMPONENTS (presentation)
#
# Tiles shown in the Signature Values scene. Each value's
# `components` list refers to these ids: those tiles are pulled
# into focus while the rest fade into the background.
# Order here = order tiles muster into the grid.
# ============================================================

businessComponents:
  - { id: customers,    label: Customers }
  - { id: programs,     label: Programs }
  - { id: engineering,  label: Engineering }
  - { id: validation,   label: Validation }
  - { id: quality,      label: Quality }
  - { id: execution,    label: Execution }
  - { id: delivery,     label: Delivery }
  - { id: people,       label: People }
  - { id: coaching,     label: Coaching }
  - { id: ownership,    label: Ownership }
  - { id: organization, label: Organization }
  - { id: ai,           label: AI }
  - { id: prototyping,  label: Prototyping }
  - { id: hypotheses,   label: Hypotheses }

