# ============================================================
# DISPLAY
# ============================================================

display:

  # ----------------------------------------------------------
  # Portrait
  # ----------------------------------------------------------

  photo: cbc.jpg

  # ----------------------------------------------------------
  # Theme
  # ----------------------------------------------------------

  theme:
    accent1: "#6366f1"
    accent2: "#22d3ee"
    background: "#070b16"

  # ----------------------------------------------------------
  # 3D Visualization
  #
  # The renderer must treat this as progressive enhancement.
  # If WebGL is unavailable, the rest of the profile still works.
  # ----------------------------------------------------------

  visual3d:

    enabled: true

    intensity: 0.85

    particleCount: 80

    nodeScale: 1

    connectionOpacity: 0.28

    cameraParallax: 0.12

    autoRotate: true

    showCareerOrbit: true

    showCompetencyNetwork: true

    showImpactNodes: true

    showMilestones: true

    showProjectNodes: true

    showLeadershipDimensions: true

    # Mobile render complexity
    mobile:

      particleCount: 24

      nodeScale: 0.9

      connectionOpacity: 0.20

      cameraParallax: 0.05

      autoRotate: false

  # ----------------------------------------------------------
  # Hero
  # ----------------------------------------------------------

  hero:

    showStats: true

    stats:

      - value: "{years}+"
        label: Years Experience

      - value: "{companies}"
        label: Companies

      - value: "{roles}"
        label: Roles

      - value: "{competencies}"
        label: Competencies

    showCoreCompetencies: true

    showTagline: true

    showSummary: true

    showLocation: true

    showProfiles: true

  # ----------------------------------------------------------
  # Chronology
  # ----------------------------------------------------------

  chrono:

    sections:

      - title: Industry
        kinds:
          - semiconductor
          - automotive
          - vision measurement
          - information technology

      - title: Academia
        kinds:
          - academia

    otherTitle: Other

    educationTitle: Education

    showTimeline: true

    showHighlights: true

    showAttributes: true

    showTags: true

    showLocation: true

  # ----------------------------------------------------------
