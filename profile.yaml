# ============================================================
# profile.yaml — single source of truth
# ============================================================
# This file contains the complete content/data model for the
# digital profile. The HTML renderer should load this file at
# runtime using js-yaml.
#
# Style rules:
#   • Plain strings need no quotes
#   • Quote dates and values that could be interpreted as numbers
#   • Lists may use "- item" or [a, b]
#   • null means no end date / currently active
# ============================================================

