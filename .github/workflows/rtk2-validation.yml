name: RTK2 validation
on:
  push:
    branches: [main, 'rtk2/**']
    paths: ['rtk2/**', '.github/workflows/rtk2-validation.yml']
  pull_request:
    paths: ['rtk2/**', '.github/workflows/rtk2-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rtk2-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rtk2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rtk2/package-lock.json
      - run: npm ci
      - name: Core and asset regression checks
        run: npm test
      - name: Current mounted UI and raster checks
        run: npm run test:v56:ui
      - name: Verify generated test documentation
        run: |
          node tools/generate-test-spec.mjs
          git diff --exit-code -- docs/test_spec.md
