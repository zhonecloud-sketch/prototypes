name: ATTK Rust build and validation
on:
  push:
    branches: [main, 'attk/**']
    paths: ['attk/**', '.github/workflows/attk-build.yml']
  pull_request:
    paths: ['attk/**', '.github/workflows/attk-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: attk-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            package: attk-windows-x64
          - runner: macos-15
            package: attk-macos-arm64
          - runner: macos-15-intel
            package: attk-macos-x64
          - runner: ubuntu-24.04
            package: attk-linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: attk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: attk/package-lock.json
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.90.0
          rustc --version
      - name: Build Windows runtime and WASM
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat
      - name: Build Unix runtime and WASM
        if: runner.os != 'Windows'
        run: sh build.sh
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        run: node tools/check-windows-runtime.mjs
      - name: Native Rust unit cases
        run: cargo test --locked --workspace
      - name: Compiled WASM equations and real server cases
        run: npm run test:rust
      - name: Windows missing-runtime and compiler-free launcher cases
        if: runner.os == 'Windows'
        run: node tests/windows-launcher-tests.mjs
      - name: Install inherited validation dependencies
        if: runner.os == 'Linux'
        run: npm ci
      - name: Inherited game and asset cases using compiled Rust
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --import=./tests/rust-preload.mjs
        run: npm test
      - name: Mounted UI and arrival raster using compiled Rust
        if: runner.os == 'Linux' && !cancelled()
        env:
          NODE_OPTIONS: --import=./tests/rust-preload.mjs
        run: npm run test:v56:ui
      - name: Install browser validation tools
        if: runner.os == 'Linux' && !cancelled()
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Real browser boot and compact layout cases
        if: runner.os == 'Linux' && !cancelled()
        run: node tests/attk-browser-tests.mjs
      - name: Package self-contained platform output
        run: node tools/package-attk.mjs ${{ matrix.package }}
      - name: Save compiled platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.package }}
          path: attk/dist/${{ matrix.package }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Save small runtime-only output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.package }}-runtime
          path: |
            attk/bin/
            attk/wasm/
            attk/RUNTIME-INFO.json
          if-no-files-found: error
          retention-days: 30
      - name: Save compact layout evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attk-browser-screenshots
          path: attk/dist/screenshots/
          if-no-files-found: ignore

  publish-runtime:
    name: Commit validated Windows runtime
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      runtime_commit: ${{ steps.commit.outputs.runtime_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch validated Windows runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: attk-windows-x64-runtime
          path: attk
      - name: Record source fingerprint and verify exact bytes
        working-directory: attk
        env:
          ATTK_BUILD_COMMIT: ${{ github.sha }}
        run: node tools/runtime-files.mjs --record
      - name: Commit only the requested runtime files and provenance
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current=$(git rev-parse FETCH_HEAD)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Main changed during validation; refusing to overwrite it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- attk/bin/attk-server.exe attk/wasm/attk_engine.wasm attk/RUNTIME-INFO.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated ATTK Windows runtime"
            git push origin HEAD:main
          fi
          echo "runtime_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify-checkout:
    name: Fresh checkout launches without Cargo
    needs: publish-runtime
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: attk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish-runtime.outputs.runtime_commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify tracked files, source fingerprint and ABI
        run: node tests/tracked-runtime-tests.mjs
      - name: Run the checkout launcher with Cargo unavailable
        run: node tests/windows-launcher-tests.mjs
