<!-- Run: python -m http.server 8000
Open: http://localhost:8000
Do not run the profile with file://
GitHub Pages works
profile.yaml must remain beside index.html
The lib directory must remain beside index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="">
  <meta name="theme-color" content="#070b16">
  <title>Digital Profile</title>
  <style>
/* =========================================================
   DESIGN TOKENS — SINGLE SOURCE OF TRUTH
   ========================================================= */
:root{
  --bg:#070b16;
  --surface:#0d1220;
  --surface-2:#12192a;
  --border:#263047;
  --text:#f4f7fb;
  --text-muted:#a7b0c2;
  --accent:#6366f1;
  --accent-soft:rgba(99,102,241,.14);
  --accent-2:#22d3ee;
  --max-page:1180px;
  --reading:740px;
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:24px;
  --space-6:32px;
  --space-7:48px;
  --space-8:64px;
  --space-9:96px;
  --radius-sm:6px;
  --radius-md:12px;
  --radius-pill:999px;
  --focus-ring:0 0 0 2px var(--accent);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}
button,a{font:inherit}
a{color:inherit}
button{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:#fff}

.app-shell{min-height:100vh;position:relative;isolation:isolate}
#three-host{position:absolute;inset:0 0 auto 0;height:760px;z-index:0;pointer-events:none;overflow:hidden}
#three-host::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,22,.18) 0%,rgba(7,11,22,.55) 64%,var(--bg) 100%);pointer-events:none}
#three-canvas{width:100%;height:100%;display:block;pointer-events:auto;touch-action:pan-y}
#three-fallback{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding:120px 16px 0;pointer-events:none}
.fallback-graphic{width:min(92vw,760px);height:260px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(145deg,rgba(99,102,241,.08),rgba(34,211,238,.04));position:relative;overflow:hidden}
.fallback-graphic::before{content:"";position:absolute;inset:16% 8%;border:1px solid rgba(99,102,241,.32);border-radius:50%;transform:rotate(-18deg) scaleX(1.25)}
.fallback-graphic::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);left:62%;top:38%;box-shadow:0 0 0 7px rgba(99,102,241,.12)}

#profile-root{position:relative;z-index:1;pointer-events:none}
#profile-root > header{pointer-events:none}
#profile-root > nav,#profile-root > main,#profile-root > footer,#profile-root > button{pointer-events:auto}
.hero > *{pointer-events:auto}
.container{width:min(calc(100% - 32px),var(--max-page));margin-inline:auto}
header{padding-top:var(--space-7);padding-bottom:var(--space-5)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:var(--space-8);align-items:end;min-height:620px;padding-top:var(--space-8)}
.identity{max-width:var(--reading);padding-bottom:var(--space-6)}
.eyebrow{display:flex;align-items:center;gap:var(--space-3);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--space-4)}
.eyebrow::before{content:"";width:32px;height:1px;background:var(--accent-2)}
h1{font-size:clamp(30px,5vw,40px);line-height:1.08;letter-spacing:-.03em;margin:0 0 var(--space-3);font-weight:700}
.hero-label{font-size:21px;line-height:1.2;font-weight:600;margin:0 0 var(--space-2)}
.hero-tagline{font-size:18px;color:var(--text-muted);margin:0 0 var(--space-5)}
.hero-copy{font-size:18px;max-width:680px;color:#d6dbea;margin:0 0 var(--space-5)}
.hero-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-5);align-items:start}
.portrait{width:148px;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--accent),var(--accent-2)) border-box;display:block}
.monogram{width:148px;aspect-ratio:1;border-radius:50%;border:3px solid var(--accent);background:var(--surface);display:grid;place-items:center;font-size:30px;font-weight:600;letter-spacing:.04em}
.contacts{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)}
.contact-pill,.profile-link{display:inline-flex;align-items:center;gap:var(--space-2);min-height:44px;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:rgba(13,18,32,.72);text-decoration:none;color:#e7eaf2;transition:transform 180ms var(--ease),border-color 180ms var(--ease),background 180ms var(--ease)}
.contact-pill:hover,.profile-link:hover{transform:translateY(-2px);border-color:rgba(99,102,241,.72);background:var(--accent-soft)}
.contact-icon{width:16px;height:16px;flex:0 0 auto;display:inline-block}
.profile-links{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)}
.location-line{font-size:14px;color:var(--text-muted);display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3)}

.hero-side{display:flex;flex-direction:column;gap:var(--space-4);padding-bottom:var(--space-6)}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.stat-card{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.75);padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.stat-value{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:30px;font-weight:600;line-height:1.15;white-space:nowrap;letter-spacing:-.03em}
.stat-label{font-size:13px;color:var(--text-muted);max-width:16ch}
.core-stack{border-left:2px solid var(--accent);padding-left:16px}
.core-title{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--space-3)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:4px 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:13px;color:#dce2ef}
.chip[data-action="competency"]{cursor:pointer}

nav.sticky-nav{position:sticky;top:0;z-index:30;padding:8px 0;border-bottom:1px solid rgba(38,48,71,.7);background:rgba(7,11,22,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav-inner{width:min(calc(100% - 32px),var(--max-page));margin-inline:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}
.tabs{display:flex;gap:8px}
.tab{appearance:none;border:1px solid transparent;background:transparent;min-height:44px;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;letter-spacing:.06em}
.tab:hover{color:var(--text);background:var(--surface)}
.tab[aria-selected="true"]{color:var(--text);border-color:rgba(99,102,241,.65);background:var(--accent-soft)}
.nav-mark{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--text-muted);white-space:nowrap}

main{padding-bottom:var(--space-9)}
.view{display:none;padding-top:var(--space-8)}
.view.active{display:block}
.section{scroll-margin-top:80px;margin-bottom:var(--space-9)}
.section-header{display:flex;justify-content:space-between;align-items:end;gap:var(--space-5);margin-bottom:var(--space-5);padding-bottom:var(--space-3);border-bottom:1px solid var(--border)}
.section-kicker{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);margin-bottom:4px}
h2{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:600}
h3{font-size:21px;line-height:1.2;margin:0;font-weight:600}
h4{font-size:18px;line-height:1.2;margin:0;font-weight:600}
.section-note{font-size:14px;color:var(--text-muted);max-width:420px;text-align:right}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:var(--space-5);scroll-margin-top:96px}
.timeline-item::before{content:"";position:absolute;left:-23px;top:28px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--accent-2)}
.role-card{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.82);padding:24px;transition:transform 180ms var(--ease),border-color 180ms var(--ease),background 180ms var(--ease)}
.role-card:hover{transform:translateY(-2px);border-color:#34415f;background:rgba(18,25,42,.92)}
.role-card.current{border-left:2px solid var(--accent);padding-left:23px}
.role-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.role-company{font-size:13px;color:var(--accent-2);font-weight:600;margin-bottom:4px}
.role-title{font-size:21px;font-weight:600;line-height:1.2}
.role-meta{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:8px;color:var(--text-muted);font-size:14px}
.role-date{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:13px;white-space:nowrap;color:#d4daea}
.present{display:inline-flex;align-items:center;min-height:28px;padding:4px 8px;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(99,102,241,.7);font-size:12px;font-weight:600;color:#dddffe}
.role-body{margin-top:var(--space-4)}
.role-body ul{margin:0;padding-left:20px}
.role-body li{margin:4px 0;color:#dce1ec}
.role-attributes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:var(--space-4)}
.attr-block{border-top:1px solid var(--border);padding-top:12px}
.attr-label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.role-tags{margin-top:var(--space-4)}
.role-tag{border-color:rgba(99,102,241,.42);background:rgba(99,102,241,.08);cursor:pointer}

.education-card{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.82);padding:24px}
.education-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px}
.education-institution{font-size:18px;font-weight:600}
.education-area{color:var(--text-muted);margin-top:4px}

.impact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.impact-card{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.84);padding:24px;cursor:pointer;transition:transform 180ms var(--ease),border-color 180ms var(--ease),background 180ms var(--ease)}
.impact-card:hover,.impact-card.is-highlighted{transform:translateY(-2px);border-color:rgba(99,102,241,.7);background:rgba(18,25,42,.96)}
.impact-card.is-highlighted{outline:2px solid var(--accent);outline-offset:0}
.impact-title{margin-bottom:16px}
.impact-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.impact-stat{border-top:1px solid var(--border);padding-top:12px}
.impact-value{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:25px;line-height:1.2;font-weight:600;white-space:nowrap}
.impact-label{font-size:13px;color:var(--text-muted);margin-top:4px}
.impact-points{margin:0;padding-left:20px;color:#dce1ec}
.evidence-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.evidence-chip{min-height:36px;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;color:#dfe4ef;font-size:13px}

.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.project-card{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.84);padding:24px;min-height:250px;display:flex;flex-direction:column}
.project-card.featured{grid-column:span 1;border-color:rgba(99,102,241,.55);background:linear-gradient(145deg,rgba(99,102,241,.08),rgba(13,18,32,.9) 42%)}
.project-summary{color:#cdd4e3;margin:12px 0 16px}
.project-meta{margin-top:auto;display:grid;gap:12px}
.project-role{font-size:13px;color:var(--text-muted)}
.project-outcomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.project-outcome{border-top:1px solid var(--border);padding-top:8px}
.project-outcome-label{font-size:12px;color:var(--text-muted)}
.project-outcome-value{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:16px;font-weight:600;margin-top:4px;white-space:nowrap}

.competency-groups{display:grid;gap:var(--space-5)}
.competency-group{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.7);overflow:hidden}
.competency-group summary{list-style:none;cursor:pointer;min-height:56px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.competency-group summary::-webkit-details-marker{display:none}
.group-title{font-size:18px;font-weight:600}
.group-count{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:13px;color:var(--text-muted)}
.competency-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px 20px}
.competency-card{border-top:1px solid var(--border);padding-top:16px}
.competency-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.competency-label{font-size:16px;font-weight:600}
.level{font-size:12px;color:var(--accent-2);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.competency-meta{font-size:13px;color:var(--text-muted);margin-top:4px}
.competency-card .chips{margin-top:8px}

.leadership-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.leadership-card{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.82);padding:24px}
.leadership-card .chips{margin-top:12px}

.milestone-list{display:grid;gap:12px}
.milestone{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
.milestone-year{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;color:var(--accent-2);font-size:14px}
.milestone-title{font-weight:600}
.milestone-role{font-size:13px;color:var(--text-muted);margin-top:4px}

.toolbox{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.78);padding:24px;display:grid;gap:16px}
.toolbox-row{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;align-items:start}
.toolbox-label{font-size:13px;font-weight:600;color:var(--text-muted);padding-top:6px}
.toolbox-values{display:flex;flex-wrap:wrap;gap:8px}
.toolbox-chip{font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:999px;color:#dae0ed}

.supporting{border:1px solid var(--border);border-radius:12px;background:rgba(13,18,32,.72);padding:24px}
.supporting-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.supporting h3{font-size:18px;margin-bottom:8px}
.supporting p{margin:0;color:var(--text-muted)}

.empty-state{border:1px dashed var(--border);border-radius:12px;padding:32px;color:var(--text-muted)}
#error-root{display:none;padding:96px 16px}
.error-panel{width:min(100%,860px);margin:0 auto;border:1px solid #6b3040;border-radius:12px;background:#160c13;padding:32px}
.error-panel h2{margin-bottom:16px;color:#ffdbe4}
.error-panel pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.55;color:#ffdbe4;background:#0f0710;border:1px solid #47202d;border-radius:6px;padding:16px;overflow:auto}
.error-panel p{margin:0 0 12px;color:#f0bcc9}

.back-to-top{position:fixed;right:24px;bottom:24px;z-index:25;min-width:44px;height:44px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity 180ms var(--ease),transform 180ms var(--ease)}
.back-to-top.visible{opacity:1;pointer-events:auto;transform:translateY(0)}

footer{padding:48px 0 64px;border-top:1px solid var(--border);color:var(--text-muted)}
.footer-inner{width:min(calc(100% - 32px),var(--max-page));margin-inline:auto;display:flex;justify-content:space-between;gap:24px;align-items:start}
.footer-copy{white-space:pre-line;font-size:13px}
.footer-links{display:flex;flex-wrap:wrap;gap:12px}
.footer-links a{font-size:13px;color:#d7deeb}

.reveal{opacity:0;transform:translateY(8px)}
.reveal.is-visible{opacity:1;transform:none;transition:opacity 180ms var(--ease),transform 180ms var(--ease)}
.flash{outline:2px solid var(--accent);outline-offset:0}

svg{display:block}

@media (min-width:1600px){
  .container,.nav-inner,.footer-inner{width:min(calc(100% - 64px),1320px)}
  .hero{min-height:700px;gap:64px}
  #three-host{height:860px}
}
@media (min-width:2400px){
  .container,.nav-inner,.footer-inner{width:min(calc(100% - 96px),1480px)}
  .hero{min-height:760px}
  #three-host{height:920px}
}
@media (min-width:1280px){
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .project-card.featured:first-child{grid-column:span 2}
}
@media (max-width:1279px){
  .hero{grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr)}
  .impact-grid,.leadership-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1023px){
  #three-host{height:650px}
  .hero{grid-template-columns:1fr;min-height:0;gap:32px;padding-top:48px}
  .identity{padding-bottom:0}
  .hero-side{padding-bottom:32px}
  .section-note{text-align:left}
  .section-header{align-items:start;flex-direction:column}
  .project-grid,.leadership-grid,.impact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:767px){
  .container,.nav-inner,.footer-inner{width:min(calc(100% - 32px),var(--max-page))}
  header{padding-top:24px}
  #three-host{height:540px}
  .hero{padding-top:24px}
  .hero-grid{grid-template-columns:1fr;justify-items:center;text-align:center}
  .identity{text-align:center}
  .hero-copy{margin-inline:auto;font-size:16px}
  .contacts,.profile-links{justify-content:center}
  .location-line{justify-content:center}
  .core-stack{text-align:left}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav-inner{justify-content:center}
  .nav-mark{display:none}
  main{padding-bottom:64px}
  .view{padding-top:48px}
  .role-top{grid-template-columns:1fr}
  .role-card{padding:20px}
  .role-card.current{padding-left:19px}
  .role-attributes{grid-template-columns:1fr}
  .impact-grid,.project-grid,.competency-list,.leadership-grid,.supporting-grid{grid-template-columns:1fr}
  .project-card.featured{grid-column:auto}
  .project-outcomes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbox-row{grid-template-columns:1fr;gap:8px}
  .education-row{grid-template-columns:1fr}
  .footer-inner{flex-direction:column}
  .section{margin-bottom:64px}
}
@media (max-width:479px){
  .container,.nav-inner,.footer-inner{width:min(calc(100% - 32px),var(--max-page))}
  h2{font-size:25px}
  .hero-label{font-size:18px}
  .hero-tagline{font-size:16px}
  .portrait,.monogram{width:128px}
  .stats-grid{gap:8px}
  .stat-card{padding:12px;min-height:104px}
  .stat-value{font-size:25px}
  .stat-label{font-size:12px;max-width:14ch}
  .tab{padding-inline:12px;font-size:12px}
  .timeline{padding-left:20px}
  .timeline-item::before{left:-19px}
  .role-date{white-space:normal}
  .project-outcomes{grid-template-columns:1fr}
  .impact-value{font-size:21px}
  .back-to-top{right:16px;bottom:16px}
}
@media (max-width:359px){
  .tab{padding-inline:8px;font-size:12px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-value{font-size:21px}
  .contact-pill,.profile-link{max-width:100%;overflow-wrap:anywhere}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
  .reveal{opacity:1;transform:none}
}
@media print{

      if(cfg.showLeadershipDimensions!==false){dims.forEach((d,i)=>addNode("dimension",d,i,maxNodes.dims))}

      const lookup=new Map(nodeObjects.map(o=>[o.userData.type+":"+o.userData.id,o]));
      function connect(a,b){if(!a||!b)return;const pts=[a.position.clone(),b.position.clone()];const geo=new THREE.BufferGeometry().setFromPoints(pts);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:accent2,transparent:true,opacity:currentCfg.connectionOpacity,depthWrite:false}));line.userData={a,b};group.add(line);connections.push(line)}
      if(cfg.showCareerOrbit!==false){const orbit=new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({length:129},(_,i)=>{const a=i/128*Math.PI*2;return new THREE.Vector3(Math.cos(a)*170,0,Math.sin(a)*170)})),new THREE.LineBasicMaterial({color:accent,transparent:true,opacity:.28}));group.add(orbit)}
      roles.forEach(role=>asArray(role.tags).forEach(cid=>connect(lookup.get("role:"+safeString(role.id)),lookup.get("competency:"+safeString(cid)))));
      impacts.forEach(item=>asArray(item.evidence).forEach(rid=>connect(lookup.get("impact:"+safeString(item.id)),lookup.get("role:"+safeString(rid)))));
      projects.forEach(p=>{connect(lookup.get("project:"+safeString(p.id)),lookup.get("role:"+safeString(p.role)));asArray(p.competencies).forEach(cid=>connect(lookup.get("project:"+safeString(p.id)),lookup.get("competency:"+safeString(cid))))});
      milestones.forEach(m=>connect(lookup.get("milestone:"+safeString(m.id)),lookup.get("role:"+safeString(m.role))));
      dims.forEach(d=>{asArray(d.competencies).forEach(cid=>connect(lookup.get("dimension:"+safeString(d.id)),lookup.get("competency:"+safeString(cid))));asArray(d.evidence).forEach(rid=>connect(lookup.get("dimension:"+safeString(d.id)),lookup.get("role:"+safeString(rid))))});

      if(currentCfg.particleCount>0){const count=Math.min(Number(currentCfg.particleCount)||0,120);const positions=new Float32Array(count*3);for(let i=0;i<count;i++){const id="particle-"+i;const p=nodePosition(id,"particle",i,count);positions[i*3]=p.x*1.65;positions[i*3+1]=p.y*1.6;positions[i*3+2]=p.z*1.65;}const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(positions,3));const pm=new THREE.PointsMaterial({color:accent2,size:1.8,transparent:true,opacity:.28,depthWrite:false});group.add(new THREE.Points(pg,pm));}

      const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();let hovered=null;let pointerInside=false;
      function pointerPos(e){const rect=canvas.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;pointerInside=true}
      function pick(){if(!pointerInside)return;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(nodeObjects,false);const next=hits[0]?.object||null;if(next!==hovered){if(hovered)hovered.scale.multiplyScalar(1/1.18);hovered=next;if(hovered)hovered.scale.multiplyScalar(1.18);highlightScene(hovered)}}
      canvas.addEventListener("pointermove",e=>{pointerPos(e);if(!state.reducedMotion.matches)pick()},{passive:true});canvas.addEventListener("pointerleave",()=>{pointerInside=false;if(hovered){hovered.scale.multiplyScalar(1/1.18);hovered=null;highlightScene(null)}},{passive:true});
      canvas.addEventListener("pointerdown",e=>{pointerPos(e);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(nodeObjects,false)[0]?.object;if(!hit)return;const u=hit.userData;if(u.type==="role")navigateToRole(u.id);else if(u.type==="competency")focusCompetency(u.id);else if(u.type==="project")focusProject(u.id);else if(u.type==="milestone")focusMilestone(u.id);else if(u.type==="dimension")focusDimension(u.id);else if(u.type==="impact"){setView("functional",true);requestAnimationFrame(()=>{const el=document.querySelector('[data-impact-id="'+cssEscape(u.id)+'"]');if(el){el.scrollIntoView({behavior:state.reducedMotion.matches?"auto":"smooth",block:"center"});el.classList.add("is-highlighted");setTimeout(()=>el.classList.remove("is-highlighted"),state.reducedMotion.matches?0:2000)}})}},{passive:true});
      let running=true,last=performance.now(),raf=0;const baseCamera=camera.position.clone();let rx=0,ry=0;
      function render(now){raf=requestAnimationFrame(render);if(document.visibilityState!=="visible"){last=now;return}const dt=Math.min((now-last)/1000,.05);last=now;if(!state.reducedMotion.matches&&currentCfg.autoRotate)group.rotation.y+=dt*.035;if(!state.reducedMotion.matches&&currentCfg.cameraParallax&&pointerInside){rx+=(pointer.y*currentCfg.cameraParallax*32-rx)*.04;ry+=(pointer.x*currentCfg.cameraParallax*32-ry)*.04;camera.position.x=baseCamera.x+ry;camera.position.y=baseCamera.y+rx;camera.lookAt(0,0,0)}else if(state.reducedMotion.matches){camera.position.copy(baseCamera);camera.lookAt(0,0,0)}renderer.render(scene,camera)}
      const ro=new ResizeObserver(()=>{const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()});ro.observe(host);
      renderer.domElement.addEventListener("webglcontextlost",e=>{e.preventDefault();running=false;cancelAnimationFrame(raf);console.error("WebGL context lost");show3DFallback()},{passive:false});
      render(performance.now());
      return {renderer,scene,camera,nodeObjects,connections,highlightByData(type,id){const active=type&&id?nodeObjects.find(o=>o.userData.type===type&&o.userData.id===safeString(id)):null;highlightScene(active)},dispose(){running=false;cancelAnimationFrame(raf);ro.disconnect();renderer.dispose()}};

      function highlightScene(active){
        nodeObjects.forEach(o=>{const on=!active||o===active;const match=active&&active.userData&&isRelated(active.userData,o.userData);o.material.opacity=on?0.92:match?0.85:.16;o.scale.setScalar((o.userData.type==="role"&&state.roleMap.get(o.userData.id)?.current?1.55:((o.userData.type==="impact"||o.userData.type==="project"&&state.projectMap.get(o.userData.id)?.featured)?1.18:1))*(o===active?1.18:1)*currentCfg.nodeScale);});connections.forEach(line=>{const on=!active||line.userData.a===active||line.userData.b===active||isRelated(active.userData,line.userData.a.userData)||isRelated(active.userData,line.userData.b.userData);line.material.opacity=on?currentCfg.connectionOpacity:.05})}
      function isRelated(a,b){if(!a||!b)return false;if(a.type==="role")return b.type==="competency"&&asArray(state.roleMap.get(a.id)?.tags).includes(b.id)||b.type==="impact"&&asArray(state.impactMap.get(b.id)?.evidence).includes(a.id)||b.type==="project"&&state.projectMap.get(b.id)?.role===a.id||b.type==="milestone"&&state.milestoneMap.get(b.id)?.role===a.id||b.type==="dimension"&&asArray(state.dimensionMap.get(b.id)?.evidence).includes(a.id);if(a.type==="competency")return b.type==="role"&&asArray(state.roleMap.get(b.id)?.tags).includes(a.id)||b.type==="project"&&asArray(state.projectMap.get(b.id)?.competencies).includes(a.id)||b.type==="dimension"&&asArray(state.dimensionMap.get(b.id)?.competencies).includes(a.id);return false}
    }
    function highlight3DCompetency(id){if(!state.three)return;const active=state.three.nodeObjects.find(o=>o.userData.type==="competency"&&o.userData.id===id);if(active){active.scale.multiplyScalar(1.18);setTimeout(()=>active.scale.multiplyScalar(1/1.18),state.reducedMotion.matches?0:2000)}}
    function hexToNumber(hex){const rgb=hexToRgb(hex);return rgb?((rgb.r<<16)|(rgb.g<<8)|rgb.b):0x6366f1}

    async function load(){
      if(!window.jsyaml || typeof window.jsyaml.load!=="function"){console.error("lib/js-yaml.js is missing");showError("lib/js-yaml.js is missing","The YAML loader could not be initialized.\nExpected global: window.jsyaml");return}
      let response,textData;
      try{response=await fetch("profile.yaml",{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);textData=await response.text();}catch(err){console.error("profile.yaml fetch failed",err);showError("Unable to load profile.yaml.",profileLoadErrorMessage().join("\n"));return}
      if(textData.charCodeAt(0)===0xFEFF)textData=textData.slice(1);
      if(textData.includes("\u0000")){console.error("profile.yaml is saved as UTF-16 — re-save as UTF-8");showError("profile.yaml is saved as UTF-16 — re-save as UTF-8");return}
      let data;
      try{data=window.jsyaml.load(textData);}catch(err){const mark=err&&err.mark;const reason=safeString(err&&err.reason)||safeString(err&&err.message)||"YAML parse failure";const line=mark&&Number.isFinite(mark.line)?mark.line+1:"unknown";const column=mark&&Number.isFinite(mark.column)?mark.column+1:"unknown";const detail=["Message: "+reason,"Reason: "+(safeString(err&&err.reason)||reason),"Line: "+line,"Column: "+column,"Technical detail: "+safeString(err&&err.stack||err)];console.error("profile.yaml YAML parse failure",err);showError("Unable to parse profile.yaml.",detail.join("\n"));return}
      if(validateAndRender(data)){console.info("profile.yaml loaded",Object.keys(data));buildThree()}
    }

    load();
  })();
  </script>
</body>
