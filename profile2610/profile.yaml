# ============================================================
# SIGNATURE VALUES
# ============================================================

signatureValues:

  - id: technical-depth
    number: "01"
    label: Technical depth
    shortLabel: Depth
    title: Make the difficult workable.
    statement: >
      Stays close to the engineering. Frames the right questions, turns
      hypotheses into working prototypes, and validates them on real systems.
      Assisted exploration shortens the path to a first implementation;
      technical judgement determines what is ready to deliver.
    method: >
      Rapid synthesis, code-assisted experimentation, and repeatable checks
      form one practical loop: understand, build, verify, refine.
    diagramLabel: Uncertainty → clarity
    diagramNote: >
      Exploratory signals converge into a verified result. Speed is useful
      when it leads to something that works.
    evidence:
      - metric: 5 days
        source: Intel / driver enablement
        text: >
          GMSL2 camera driver enabled for a next-generation platform within
          five days. GMSL2 is the camera's high-speed serial connection.
      - metric: 85 tests
        source: Intel / automation
        text: >
          Manual test cases automated and validated in product milestones
          within two quarters.
    more: >
      Intel: video colour-corruption and video-tearing detection algorithms
      each developed within a quarter. Logged defects reduced from 12 to 4
      per week within two years.

  - id: delivery-orchestration
    number: "02"
    label: Delivery orchestration
    shortLabel: Delivery
    title: Bring the whole system forward.
    statement: >
      Connects technical decisions to program commitments. Aligns customers,
      engineering, validation, and operations around clear priorities,
      visible dependencies, and measurable outcomes.
    method: >
      Carries the same rapid exploration and verification discipline into
      delivery: make uncertainty visible early and turn validated progress
      into a shared basis for decisions.
    diagramLabel: Disciplines → shared direction
    diagramNote: >
      Parallel workstreams meet at shared milestones. The whole program
      moves when its dependencies move together.
    evidence:
      - metric: 140+ → 5
        source: Continental / quality
        text: Customer-found defects reduced within three years.
      - metric: End to end
        source: Blaupunkt / program management
        text: >
          Delivery across R&D, finance, procurement, circuit-board assembly,
          product assembly, and reliability testing.
    more: >
      Continental: Functional Test Site Lead and Business Owner for Penang.
      Intel: software leadership across Media and Imaging; validation
      leadership across Media, Imaging, and SR-IOV (I/O virtualisation).

  - id: talent-elevation
    number: "03"
    label: Talent elevation
    shortLabel: People
    title: Build capability that carries on.
    statement: >
      Develops people through coaching, practical ownership, and opportunities
      to take on more demanding work. Makes engineering reasoning visible,
      so that the team grows in judgement as well as output.
    method: >
      The tools can accelerate an iteration. Coaching turns that iteration
      into understanding, independent decisions, and lasting capability.
    diagramLabel: Individual growth → wider capability
    diagramNote: >
      Knowledge branches outward. The measure of leadership is what others
      become capable of doing for themselves.
    evidence:
      - metric: 1 year
        source: Intel / capability development
        text: An engineer developed from non-performing to key contributor.
      - metric: 3 years
        source: Continental / career development
        text: A validation engineer progressed to global Project Manager.
    more: >
      The foundation includes lecturing in Computer Engineering, C/C++,
      Java, and Assembly Language, followed by people leadership at
      Agilent, Blaupunkt, Continental, and Intel.

