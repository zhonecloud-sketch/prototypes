  - id: technical
    number: "01"
    label: Technical
    animation: technical
    statement: >-
      Develops practical solutions to difficult engineering problems,
      combining hands-on software expertise with hypothesis-led
      experimentation and validation on real systems.
    method: >-
      Uses assisted exploration and code-assisted prototyping to test ideas
      quickly, with engineering judgement and repeatable checks guiding the
      result.
    evidence:
      - metric: 1 quarter
        title: Video colour-corruption detection
        text: Innovated a detection algorithm within a quarter.
        source: Intel
      - metric: 1 quarter
        title: Video-tearing detection
        text: Innovated a detection algorithm within a quarter.
        source: Intel
    more: >-
      Technical leadership across Media and Imaging software, and validation
      across Media, Imaging, and SR-IOV (I/O virtualisation).
  - id: optimisation
    number: "02"
    label: Optimisation
    animation: optimisation
    statement: >-
      Improves delivery speed and product quality through focused technical
      execution, test automation, and coordination across engineering,
      programs, customers, and operations.
    method: >-
      Combines rapid synthesis, assisted implementation, and automated
      checks to shorten iteration cycles while retaining validation at
      product milestones.
    evidence:
      - metric: 5 days
        title: Camera-driver enablement
        text: >-
          Enabled a GMSL2 camera driver for a next-generation platform
          within five days.
        source: Intel
      - metric: 85 tests
        title: Manual testing automated
        text: >-
          Automated and validated 85 manual test cases in product milestones
          within two quarters.
        source: Intel
      - metric: 140+ → 5
        title: Customer-found defects
        text: Reduced within three years.
        source: Continental
      - metric: 12 → 4
        title: Logged defects per week
        text: Reduced within two years.
        source: Intel
    more: >-
      Program delivery at Blaupunkt spanned R&D, finance, procurement,
      circuit-board assembly, product assembly, and reliability tests.
      Functional Test Site Lead and Business Owner for Continental Penang.
  - id: people
    number: "03"
    label: People
    animation: people
    statement: >-
      Elevates talent through practical coaching, clear ownership, and
      opportunities to grow into stronger technical and organisational
      roles.
    method: >-
      Makes the reasoning behind prototypes and validation visible, so
      faster iterations also develop understanding, judgement, and
      independent ownership.
    evidence:
      - metric: 1 year
        title: Key-contributor development
        text: >-
          Developed an engineer from non-performing to key contributor
          within one year.
        source: Intel
      - metric: 3 years
        title: Progression to global Project Manager
        text: >-
          Supported an engineer’s progression from validation engineer to
          global Project Manager within three years.
        source: Continental
    more: >-
      People management at Agilent, Blaupunkt, Continental, and Intel,
      grounded in earlier teaching of Computer Engineering, C/C++, Java, and
      Assembly Language.

