<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0,
  maximum-scale=1.0, user-scalable=no">
<title>2026 - Year of the Horse</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;700&display=swap"
  rel="stylesheet">
<style>
/* ===== Variables ===== */
:root {
  --ink: #1a0a00;
  --rice: #faf6ec;
  --vermillion: #c43a31;
  --cinnabar: #9b1b1b;
  --gold: #d4a843;
  --gold-bright: #f0d060;
  --jade: #2e7d5e;
  --warm-gray: #8c7e72;
  --silk: #f4efe3;
}

/* ===== Reset ===== */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  font-family: 'Noto Sans SC', sans-serif;
}

/* ===== Ink-Wash Sky ===== */
body {
  background: linear-gradient(
    180deg,
    #0d0805 0%,
    #1c1008 15%,
    #2a1610 35%,
    #3d1c12 55%,
    #1a0a04 100%
  );
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  position: relative;
}

/* ===== Floating Ink-Mountains (layered silhouettes) ===== */
.mountains {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 35vh;
  pointer-events: none; z-index: 0;
}

.mountain {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--ink);
  opacity: 0.15;
}

.mountain--far {
  height: 100%;
  clip-path: polygon(
    0 70%, 8% 50%, 18% 60%, 30% 35%, 42% 55%,
    55% 25%, 68% 45%, 78% 30%, 88% 50%, 100% 40%,
    100% 100%, 0 100%
  );
  opacity: 0.08;
}

.mountain--mid {
  height: 70%;
  clip-path: polygon(
    0 80%, 12% 55%, 25% 70%, 38% 40%, 50% 65%,
    62% 35%, 75% 55%, 88% 45%, 100% 60%,
    100% 100%, 0 100%
  );
  opacity: 0.12;
}

.mountain--near {
  height: 40%;
  clip-path: polygon(
    0 70%, 15% 45%, 30% 60%, 50% 30%, 70% 55%,
    85% 40%, 100% 55%, 100% 100%, 0 100%
  );
  opacity: 0.18;
}

/* ===== Floating Gold Dust ===== */
.dust-layer {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 1;
  overflow: hidden;
}

.dust {
  position: absolute;
  border-radius: 50%;
  background: var(--gold-bright);
  opacity: 0;
  animation: dustDrift linear infinite;
}

@keyframes dustDrift {
  0%   { opacity: 0; transform: translateY(0) scale(0.3); }
  15%  { opacity: 0.8; }
  85%  { opacity: 0.5; }
  100% { opacity: 0; transform: translateY(-70vh) scale(0.8)
    translateX(20px); }
}

/* ===== Scroll Container ===== */
.scroll-stage {
  position: relative;
  z-index: 10;
  /* scroll dimensions */
  --sw: min(320px, 82vw);
  --sh: calc(var(--sw) * 1.55);
}

/* ===== Chinese Scroll Card ===== */
.scroll-card {
  width: var(--sw);
  height: var(--sh);
  position: relative;
  filter: drop-shadow(0 12px 40px rgba(0,0,0,0.6));
}

/* -- Scroll Rollers (top and bottom wooden dowels) -- */
.roller {
  position: absolute;
  left: -6%;
  width: 112%;
  height: clamp(18px, 5vw, 26px);
  background:
    linear-gradient(
      180deg,
      #c9a96e 0%, #a07840 40%,
      #8a6530 60%, #70502a 100%
    );
  border-radius: 999px;
  z-index: 20;
  box-shadow:
    0 2px 8px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.2);
}

.roller::before,
.roller::after {
  content: '';
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: clamp(10px, 3vw, 14px);
  height: clamp(24px, 6.5vw, 34px);
  background:
    linear-gradient(180deg, #b8943f, #8b6914);
  border-radius: 3px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.roller::before { left: -2px; }
.roller::after  { right: -2px; }

.roller--top { top: 0; transform: translateY(-50%); }
.roller--bot { bottom: 0; transform: translateY(50%); }

/* -- Silk Paper -- */
.silk-paper {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    linear-gradient(
      180deg,
      var(--silk) 0%,
      var(--rice) 30%,
      #f8f2e4 70%,
      var(--silk) 100%
    );
  border-left: 3px solid var(--gold);
  border-right: 3px solid var(--gold);
  overflow: hidden;
}

/* Paper texture overlay */
.silk-paper::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(180, 160, 120, 0.04) 3px,
    rgba(180, 160, 120, 0.04) 4px
  );
  pointer-events: none;
}

/* ===== Seal Stamp (chop mark) ===== */
.chop {
  position: absolute;
  bottom: 14%;
  right: 10%;
  width: clamp(36px, 10vw, 50px);
  height: clamp(36px, 10vw, 50px);
  border: 2px solid var(--vermillion);
  border-radius: 4px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(18px, 5vw, 26px);
  color: var(--vermillion);
  transform: rotate(-8deg);
  opacity: 0.85;
  z-index: 15;
}

/* ===== Card Content ===== */
.card-content {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  padding:
    clamp(30px, 8vw, 44px)
    clamp(16px, 5vw, 28px)
    clamp(30px, 8vw, 44px);
  gap: clamp(6px, 1.8vw, 12px);
  text-align: center;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

/* -- Year line -- */
.year-line {
  font-size: clamp(10px, 2.6vw, 12px);
  letter-spacing: 4px;
  color: var(--warm-gray);
  font-weight: 700;
  text-transform: uppercase;
}

/* -- Main Title -- */
.main-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(2.2rem, 10vw, 3rem);
  color: var(--cinnabar);
  line-height: 1.1;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.06);
}

/* -- Sub Title -- */
.sub-title {
  font-size: clamp(10px, 2.5vw, 12px);
  color: var(--warm-gray);
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* -- Ink Brush Divider -- */
.ink-divider {
  width: 50%;
  height: 2px;
  position: relative;
  margin: clamp(4px, 1vw, 8px) 0;
}

.ink-divider::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100%;
  background: linear-gradient(
    to right,
    transparent 0%,
    var(--gold) 20%,
    var(--gold) 80%,
    transparent 100%
  );
}

.ink-divider::after {
  content: '';
  position: absolute;
  top: -3px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 8px;
  background: var(--gold);
  border-radius: 50%;
}

/* -- Dear Line -- */
.dear-line {
  font-size: clamp(13px, 3.4vw, 15px);
  color: var(--cinnabar);
  font-weight: 700;
}

/* -- Horse Ink Painting -- */
.horse-ink {
  width: clamp(90px, 26vw, 140px);
  flex-shrink: 0;
  position: relative;
}

.horse-ink svg {
  width: 100%;
  height: auto;
  animation: horseBreath 4s ease-in-out infinite;
}

@keyframes horseBreath {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-4px) scale(1.015); }
}

/* -- Blessing Text -- */
.blessing-text {
  font-size: clamp(12px, 3vw, 14px);
  color: var(--ink);
  line-height: 1.7;
  font-weight: 300;
  max-width: 90%;
}

/* -- Auspicious phrase -- */
.auspicious {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(1rem, 4.5vw, 1.3rem);
  color: var(--cinnabar);
  letter-spacing: 2px;
}

/* -- Signature -- */
.signature-block {
  margin-top: auto;
  padding-top: clamp(6px, 1.5vw, 10px);
  border-top: 1px solid rgba(0,0,0,0.06);
}

.signature-warmly {
  font-size: clamp(11px, 2.6vw, 12px);
  color: var(--warm-gray);
  font-style: italic;
}

.signature-name {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(1.3rem, 5.5vw, 1.7rem);
  color: var(--cinnabar);
}

/* ===== Unrolling Cover ===== */
/*
 * The scroll starts "rolled up" - a cover panel
 * with an invitation sits on top.
 * On tap, it rolls up (slides upward) to reveal
 * the card content beneath.
 */
.scroll-cover {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 16;
  transition: transform 1s cubic-bezier(.77, 0, .18, 1);
  will-change: transform;
  pointer-events: none;
}

.scroll-stage.unrolled .scroll-cover {
  transform: translateY(-100%);
}

.cover-face {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse at 50% 40%,
      #c43a31 0%,
      var(--cinnabar) 60%,
      #5a0e0e 100%
    );
  border-left: 3px solid var(--gold);
  border-right: 3px solid var(--gold);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: clamp(10px, 3vw, 20px);
  overflow: hidden;
}

/* Cover decorative corner motifs */
.cover-face::before,
.cover-face::after {
  content: '';
  position: absolute;
  width: clamp(40px, 12vw, 60px);
  height: clamp(40px, 12vw, 60px);
  border: 2px solid rgba(212, 168, 67, 0.25);
  pointer-events: none;
}

.cover-face::before {
  top: 12px; left: 12px;
  border-right: none; border-bottom: none;
}

.cover-face::after {
  bottom: 12px; right: 12px;
  border-left: none; border-top: none;
}

.cover-year {
  font-size: clamp(12px, 3vw, 14px);
  letter-spacing: 5px;
  color: var(--gold);
  font-weight: 700;
}

.cover-horse-char {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(5rem, 22vw, 8rem);
  color: rgba(212, 168, 67, 0.12);
  line-height: 1;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

.cover-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(2rem, 9vw, 2.8rem);
  color: var(--gold);
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  position: relative;
  z-index: 2;
}

.cover-sub {
  font-size: clamp(10px, 2.5vw, 12px);
  letter-spacing: 3px;
  color: rgba(240, 208, 96, 0.7);
  text-transform: uppercase;
  position: relative;
  z-index: 2;
}

.cover-seal {
  width: clamp(52px, 14vw, 68px);
  height: clamp(52px, 14vw, 68px);
  border-radius: 50%;
  border: 2px solid var(--gold);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(26px, 7vw, 34px);
  color: var(--gold);
  position: relative;
  z-index: 2;
  animation: coverSealGlow 2.5s ease-in-out infinite;
}

@keyframes coverSealGlow {
  0%, 100% {
    box-shadow: 0 0 12px rgba(212, 168, 67, 0.3);
  }
  50% {
    box-shadow: 0 0 28px rgba(212, 168, 67, 0.6);
  }
}

/* ===== Hint ===== */
.hint {
  position: fixed;
  bottom: max(20px, env(safe-area-inset-bottom, 20px));
  left: 50%; transform: translateX(-50%);
  z-index: 30;
  color: var(--gold);
  font-size: clamp(11px, 3vw, 14px);
  letter-spacing: 3px;
  text-align: center;
  pointer-events: none;
  animation: hintBreath 3s ease-in-out infinite;
  transition: opacity 0.5s ease;
  white-space: nowrap;
  text-shadow: 0 0 10px rgba(212, 168, 67, 0.4);
}

@keyframes hintBreath {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.3; }
}

/* ===== Firework Burst Particles ===== */
.firework {
  position: fixed;
  width: 4px; height: 4px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 50;
}

/* ===== Calligraphy Reveal Animation ===== */
.card-content > * {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.scroll-stage.unrolled .card-content > * {
  opacity: 1;
  transform: translateY(0);
}

/* Stagger the reveal */
.scroll-stage.unrolled .card-content > *:nth-child(1)
  { transition-delay: 0.7s; }
.scroll-stage.unrolled .card-content > *:nth-child(2)
  { transition-delay: 0.85s; }
.scroll-stage.unrolled .card-content > *:nth-child(3)
  { transition-delay: 1.0s; }
.scroll-stage.unrolled .card-content > *:nth-child(4)
  { transition-delay: 1.1s; }
.scroll-stage.unrolled .card-content > *:nth-child(5)
  { transition-delay: 1.2s; }
.scroll-stage.unrolled .card-content > *:nth-child(6)
  { transition-delay: 1.35s; }
.scroll-stage.unrolled .card-content > *:nth-child(7)
  { transition-delay: 1.5s; }
.scroll-stage.unrolled .card-content > *:nth-child(8)
  { transition-delay: 1.65s; }
.scroll-stage.unrolled .card-content > *:nth-child(9)
  { transition-delay: 1.8s; }
.scroll-stage.unrolled .card-content > *:nth-child(10)
  { transition-delay: 1.95s; }
.scroll-stage.unrolled .card-content > *:nth-child(11)
  { transition-delay: 2.1s; }

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

        <div class="cover-title">新年快乐</div>
        <span class="cover-sub">Happy New Year</span>
        <div class="cover-seal">馬</div>
      </div>
    </div>

  </div><!-- /.scroll-card -->
</div><!-- /.scroll-stage -->

<!-- Hint -->
<p class="hint" id="hint">TAP TO UNROLL</p>

<script>
(function () {
  'use strict';

  var stage = document.getElementById('scrollStage');
  var hint  = document.getElementById('hint');
  var dearLine = document.getElementById('dearLine');

  // --- Recipient name from URL ?name=... ---
  (function setRecipient() {
    var params = new URLSearchParams(
      window.location.search
    );
    var name = params.get('name');
    if (name) {
      dearLine.textContent = 'Dear ' + name + ',';
    }
  })();

  var isOpen = false;
  var busy   = false;
  var burstFired = false;

  // --- Gold Dust Particles ---
  (function initDust() {
    var layer = document.getElementById('dustLayer');
    for (var i = 0; i < 30; i++) {
      var d = document.createElement('div');
      d.className = 'dust';
      d.style.left = (Math.random() * 100) + '%';
      d.style.bottom = '-6px';
      d.style.width = d.style.height =
        (1.5 + Math.random() * 2.5) + 'px';
      d.style.animationDuration =
        (6 + Math.random() * 8) + 's';
      d.style.animationDelay =
        (Math.random() * 10) + 's';
      layer.appendChild(d);
    }
  })();

  // --- Toggle ---
  function toggle() {
    if (busy) return;
    busy = true;

    if (!isOpen) {
      stage.classList.add('unrolled');
      hint.textContent = 'HAPPY NEW YEAR!';
      hint.style.color = '#fff';
      isOpen = true;

      if (!burstFired) {
        setTimeout(fireFireworks, 800);
        burstFired = true;
      }

      setTimeout(function () { busy = false; }, 1200);
    } else {
      stage.classList.remove('unrolled');
      hint.textContent = 'TAP TO UNROLL';
      hint.style.color = '';
      isOpen = false;
      burstFired = false;

      setTimeout(function () { busy = false; }, 1200);
    }
  }

  // --- Firework Bursts ---
  function fireFireworks() {
    var colors = [
      '#FFD700', '#FF4444', '#FFFFFF',
      '#FF6F00', '#FFEB3B', '#E53935',
      '#d4a843', '#f0d060'
    ];
    // Create 3 burst origins
    var origins = [
      { x: 25, y: 20 },
      { x: 50, y: 15 },
      { x: 75, y: 25 }
    ];

    origins.forEach(function (origin, oi) {
      setTimeout(function () {
        for (var i = 0; i < 24; i++) {
          (function (idx) {
            var el = document.createElement('div');
            el.className = 'firework';
            var size = 3 + Math.random() * 4;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.backgroundColor =
              colors[Math.floor(
                Math.random() * colors.length
              )];
            el.style.left = origin.x + '%';
            el.style.top = origin.y + '%';
            el.style.borderRadius =
              Math.random() > 0.4 ? '50%' : '1px';
            document.body.appendChild(el);

            var angle = (Math.PI * 2 / 24) * idx
              + (Math.random() - 0.5) * 0.4;
            var dist = 80 + Math.random() * 120;
            var dx = Math.cos(angle) * dist;
            var dy = Math.sin(angle) * dist;
            var dur = 1200 + Math.random() * 800;

            var anim = el.animate([
              {
                transform: 'translate(0,0) scale(1)',
                opacity: 1
              },
              {
                transform:
                  'translate(' + dx + 'px,' +
                  (dy + 40) + 'px) scale(0.2)',
                opacity: 0
              }
            ], {
              duration: dur,
              easing: 'cubic-bezier(.15,.9,.45,1)'
            });

            anim.onfinish = function () {
              el.remove();
            };
          })(i);
        }
      }, oi * 400);
    });
  }

  // --- Tap anywhere ---
  document.addEventListener('click', toggle);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggle();
    }
  });
})();
</script>
</body>
</html>
