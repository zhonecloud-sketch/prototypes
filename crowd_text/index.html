<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Articulated Crowd - Fixed Camera & Text</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    #canvas-container { width: 100vw; height: 100vh; }
    #btn-toggle-ui { position: absolute; top: 20px; right: 20px; z-index: 30; background: rgba(15, 23, 42, 0.9); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; width: 46px; height: 46px; font-size: 22px; cursor: pointer; backdrop-filter: blur(8px); transition: transform 0.2s; display: flex; align-items: center; justify-content: center; }
    #btn-toggle-ui:hover { transform: scale(1.1); }
    #ui-panel { position: absolute; top: 80px; right: 20px; z-index: 20; width: 320px; max-height: calc(100vh - 120px); overflow-y: auto; background: rgba(15, 23, 42, 0.92); border-radius: 16px; padding: 16px; backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); transform: translateX(150%); transition: transform 0.3s ease; }
    #ui-panel.open { transform: translateX(0); }
    #ui-panel h3 { margin: 0 0 10px; color: #f8fafc; font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; }
    #ui-panel .row { display: flex; gap: 8px; margin-bottom: 8px; }
    #ui-panel .row button { flex: 1; padding: 8px 0; font-size: 13px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    #ui-panel .row button:active { transform: scale(0.98); }
    #btn-form { background: #2563eb; color: white; }
    #btn-form:hover { background: #3b82f6; }
    #btn-scatter, #btn-topview, #btn-reset { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; }
    #btn-scatter:hover, #btn-topview:hover, #btn-reset:hover { background: rgba(255, 255, 255, 0.2); }
    #text-input { width: 100%; height: 56px; resize: none; background: rgba(30, 41, 59, 0.8); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 13px; line-height: 1.4; outline: none; margin-bottom: 8px; }
    #text-input:focus { border-color: #3b82f6; }
    .speed-container, .people-container { display: flex; align-items: center; gap: 8px; color: #cbd5e1; font-size: 13px; background: rgba(30, 41, 59, 0.5); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 8px; }
    .speed-container input[type="range"], .people-container input[type="range"] { flex: 1; accent-color: #3b82f6; cursor: pointer; }
    #controls-hint { background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 8px; margin-top: 8px; font-size: 12px; line-height: 1.6; color: #94a3b8; }
    #controls-hint strong { color: #e2e8f0; }
    @media (max-width: 600px) { #ui-panel { top: 70px; right: 10px; width: calc(100vw - 20px); max-height: calc(100vh - 100px); } #btn-toggle-ui { width: 44px; height: 44px; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <button id="btn-toggle-ui" title="Toggle Controls">☰</button>

  <div id="ui-panel">
    <h3>Controls</h3>
    <textarea id="text-input" rows="3" maxlength="60" placeholder="Enter text (1-3 lines)...">我是锺武正</textarea>
    <div class="row">
      <button id="btn-form">Form Text</button>
      <button id="btn-scatter">Scatter Crowd</button>
    </div>
    <div class="row">
      <button id="btn-topview">Bird's-Eye</button>
      <button id="btn-reset">Reset View</button>
    </div>
    <div class="speed-container">
      <label for="speed-slider">Speed</label>
      <input type="range" id="speed-slider" min="0.1" max="12" step="0.1" value="0.1">
    </div>
    <div class="people-container">
      <label for="people-slider">People</label>
      <input type="range" id="people-slider" min="300" max="3000" step="100" value="1500">
    </div>
    <div id="controls-hint">
      <strong>Camera Navigation:</strong><br>
      • Left Mouse Drag: Rotate / Orbit<br>
      • Right Mouse Drag: Pan Camera<br>
      • Scroll Wheel: Zoom In / Out<br>
      • Spacebar: Reset Camera
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // ---------- SCENE SETUP ----------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d111a);
    scene.fog = new THREE.FogExp2(0x0d111a, 0.007);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // ---------- ORBIT CONTROLS ----------
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

    // Initial Default Camera (Previous View)
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 25, 75);
    const DEFAULT_CAM_TARGET = new THREE.Vector3(0, 0, 0);

    function resetCamera() {
      camera.position.copy(DEFAULT_CAM_POS);
      controls.target.copy(DEFAULT_CAM_TARGET);
      controls.update();
    }

    // ---------- LIGHTING ----------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
    dirLight.position.set(50, 90, 40);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.left = -70;
    dirLight.shadow.camera.right = 70;
    dirLight.shadow.camera.top = 70;
    dirLight.shadow.camera.bottom = -70;
    scene.add(dirLight);

    // ---------- FLOOR & GRID ----------
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 140),
      new THREE.MeshStandardMaterial({ color: 0x161d2a, roughness: 0.85 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const grid = new THREE.GridHelper(200, 50, 0x3b82f6, 0x1e293b);
    grid.position.y = 0.01;
    scene.add(grid);

    // ---------- COLOR PALETTES ----------
    const shirtColors = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0x06b6d4, 0xf97316];
    const pantColors = [0x1e293b, 0x334155, 0x475569, 0x27272a, 0x18181b];
    const skinColors = [0xffdbac, 0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524];
    const hairColors = [0x1a120b, 0x2c1d11, 0x8d4a20, 0xd6c280, 0x9a3324];

    // ---------- DYNAMIC CROWD SIZE ----------
    let CROWD_SIZE = 1500;
    let agents = [];
    let parts = {};

    function buildCrowd(size) {
      agents = [];
      for (let i = 0; i < size; i++) {
        const startX = (Math.random() - 0.5) * 120;
        const startZ = (Math.random() - 0.5) * 70;
        agents.push({
          pos: new THREE.Vector3(startX, 0, startZ),
          vel: new THREE.Vector3(0, 0, 0),
          rotY: 0,
          scatterTarget: new THREE.Vector3(startX, 0, startZ),
          textTarget: new THREE.Vector3(0, 0, 0),
          speed: 0.11 + Math.random() * 0.07,
          phase: Math.random() * Math.PI * 2,
          hairStyle: Math.random() < 0.5 ? 0 : 1
        });
      }

      for (const key in parts) {
        scene.remove(parts[key]);
        parts[key].dispose();
      }
      parts = {};

      const shirtMat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
      const pantMat = new THREE.MeshStandardMaterial({ roughness: 0.7 });
      const skinMat = new THREE.MeshStandardMaterial({ roughness: 0.5 });
      const hairMat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
      const shoeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });

      const torsoGeo = new THREE.BoxGeometry(0.5, 0.65, 0.28);
      const pelvisGeo = new THREE.BoxGeometry(0.48, 0.2, 0.26);
      const headGeo = new THREE.SphereGeometry(0.2, 8, 8);
      const hair0Geo = new THREE.BoxGeometry(0.42, 0.16, 0.44);
      const hair1Geo = new THREE.SphereGeometry(0.22, 8, 8, 0, Math.PI * 2, 0, Math.PI * 0.6);

      const upperArmGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.3, 6);
      upperArmGeo.translate(0, -0.15, 0);
      const lowerArmGeo = new THREE.CylinderGeometry(0.065, 0.055, 0.3, 6);
      lowerArmGeo.translate(0, -0.15, 0);
      const upperLegGeo = new THREE.CylinderGeometry(0.1, 0.09, 0.32, 6);
      upperLegGeo.translate(0, -0.16, 0);
      const lowerLegGeo = new THREE.CylinderGeometry(0.085, 0.075, 0.32, 6);
      lowerLegGeo.translate(0, -0.16, 0);
      const footGeo = new THREE.BoxGeometry(0.12, 0.08, 0.22);

      function createInstancedPart(name, geo, material) {
        const mesh = new THREE.InstancedMesh(geo, material, CROWD_SIZE);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        return mesh;
      }

      parts.torso = createInstancedPart('torso', torsoGeo, shirtMat);
      parts.pelvis = createInstancedPart('pelvis', pelvisGeo, pantMat);
      parts.head = createInstancedPart('head', headGeo, skinMat);
      parts.hair0 = createInstancedPart('hair0', hair0Geo, hairMat);
      parts.hair1 = createInstancedPart('hair1', hair1Geo, hairMat);
      parts.leftUpperArm = createInstancedPart('leftUpperArm', upperArmGeo, shirtMat);
      parts.rightUpperArm = createInstancedPart('rightUpperArm', upperArmGeo, shirtMat);
      parts.leftLowerArm = createInstancedPart('leftLowerArm', lowerArmGeo, skinMat);
      parts.rightLowerArm = createInstancedPart('rightLowerArm', lowerArmGeo, skinMat);
      parts.leftUpperLeg = createInstancedPart('leftUpperLeg', upperLegGeo, pantMat);
      parts.rightUpperLeg = createInstancedPart('rightUpperLeg', upperLegGeo, pantMat);
      parts.leftLowerLeg = createInstancedPart('leftLowerLeg', lowerLegGeo, pantMat);
      parts.rightLowerLeg = createInstancedPart('rightLowerLeg', lowerLegGeo, pantMat);
      parts.leftFoot = createInstancedPart('leftFoot', footGeo, shoeMat);
      parts.rightFoot = createInstancedPart('rightFoot', footGeo, shoeMat);

      const color = new THREE.Color();
      for (let i = 0; i < CROWD_SIZE; i++) {
        color.setHex(shirtColors[Math.floor(Math.random() * shirtColors.length)]);
        parts.torso.setColorAt(i, color);
        color.setHex(pantColors[Math.floor(Math.random() * pantColors.length)]);
        parts.pelvis.setColorAt(i, color);
        color.setHex(skinColors[Math.floor(Math.random() * skinColors.length)]);
        parts.head.setColorAt(i, color);
        color.setHex(hairColors[Math.floor(Math.random() * hairColors.length)]);
        parts.hair0.setColorAt(i, color);
        parts.hair1.setColorAt(i, color);
        const shirtCol = shirtColors[Math.floor(Math.random() * shirtColors.length)];
        color.setHex(shirtCol);
        parts.leftUpperArm.setColorAt(i, color);
        parts.rightUpperArm.setColorAt(i, color);
        const skinCol = skinColors[Math.floor(Math.random() * skinColors.length)];
        color.setHex(skinCol);
        parts.leftLowerArm.setColorAt(i, color);
        parts.rightLowerArm.setColorAt(i, color);
        const pantCol = pantColors[Math.floor(Math.random() * pantColors.length)];
        color.setHex(pantCol);
        parts.leftUpperLeg.setColorAt(i, color);
        parts.rightUpperLeg.setColorAt(i, color);
        parts.leftLowerLeg.setColorAt(i, color);
        parts.rightLowerLeg.setColorAt(i, color);
      }
    }

    buildCrowd(CROWD_SIZE);

    let state = 'scattered';
    let speedMultiplier = 0.1; // Default speed is minimum

    // Boid parameters (Tuned for stable text formation)
    const SEPARATION_RADIUS = 0.8;
    const SEPARATION_WEIGHT = 1.5;
    const MAX_SPEED = 1.0;
    const ARRIVAL_RADIUS = 0.8;

    // ---------- TEXT SAMPLING ----------
    function sampleTextTargets(lines, maxPoints) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1200;
      canvas.height = 500;
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'white';
      const fontSize = lines.length >= 3 ? 60 : 80;
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lineHeight = fontSize * 1.2;
      const startY = (canvas.height / 2) - (((lines.length - 1) * lineHeight) / 2);
      lines.forEach((line, index) => {
        ctx.fillText(line, canvas.width / 2, startY + (index * lineHeight));
      });

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const allPoints = [];
      // Step increased to 3 to space agents out more
      const step = 3;
      // Reverted scale to 0.15 for clearer letter shapes
      const SCALE = 0.15;
      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          const idx = (y * canvas.width + x) * 4;
          if (imgData.data[idx] > 150) {
            const worldX = (x - canvas.width / 2) * SCALE;
            const worldZ = (y - canvas.height / 2) * SCALE;
            allPoints.push({ x: worldX, z: worldZ });
          }
        }
      }

      for (let i = allPoints.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allPoints[i], allPoints[j]] = [allPoints[j], allPoints[i]];
      }

      if (allPoints.length >= maxPoints) {
        return allPoints.slice(0, maxPoints);
      }

      const result = allPoints.slice();
      while (result.length < maxPoints) {
        const idx = Math.floor(Math.random() * allPoints.length);
        const base = allPoints[idx];
        result.push({ x: base.x + (Math.random() - 0.5) * 0.2, z: base.z + (Math.random() - 0.5) * 0.2 });
      }
      return result;
    }

    // ---------- UI EVENT HANDLERS ----------
    const textInput = document.getElementById('text-input');
    const speedSlider = document.getElementById('speed-slider');
    const peopleSlider = document.getElementById('people-slider');
    const toggleBtn = document.getElementById('btn-toggle-ui');
    const uiPanel = document.getElementById('ui-panel');

    toggleBtn.addEventListener('click', () => uiPanel.classList.toggle('open'));

    textInput.addEventListener('input', () => {
      let lines = textInput.value.split('\n');
      if (lines.length > 3) textInput.value = lines.slice(0, 3).join('\n');
    });

    speedSlider.addEventListener('input', (e) => speedMultiplier = parseFloat(e.target.value));

    peopleSlider.addEventListener('input', (e) => {
      const newSize = parseInt(e.target.value);
      if (newSize !== CROWD_SIZE) {
        CROWD_SIZE = newSize;
        buildCrowd(CROWD_SIZE);
        if (state === 'forming') {
          const content = textInput.value || "A";
          const lines = content.split('\n').slice(0, 3);
          const points = sampleTextTargets(lines, CROWD_SIZE);
          agents.forEach((agent, i) => {
            const pt = points[i % points.length];
            agent.textTarget.set(pt.x, 0, pt.z);
          });
        } else {
          state = 'scattered';
          agents.forEach(a => {
            a.scatterTarget.set((Math.random() - 0.5) * 120, 0, (Math.random() - 0.5) * 70);
          });
        }
        // No camera movement here
      }
    });

    // Form Text: does NOT change camera
    document.getElementById('btn-form').addEventListener('click', () => {
      let content = textInput.value;
      if (!content || content.trim().length === 0) {
        content = "A";
        textInput.value = content;
      }
      const lines = content.split('\n').slice(0, 3);
      const points = sampleTextTargets(lines, CROWD_SIZE);
      agents.forEach((agent, i) => {
        const pt = points[i % points.length];
        agent.textTarget.set(pt.x, 0, pt.z);
      });
      state = 'forming';
    });

    // Scatter Crowd: does NOT change camera
    document.getElementById('btn-scatter').addEventListener('click', () => {
      state = 'scattered';
      agents.forEach(a => {
        a.scatterTarget.set((Math.random() - 0.5) * 120, 0, (Math.random() - 0.5) * 70);
      });
    });

    // Bird's-Eye: explicitly changes camera
    document.getElementById('btn-topview').addEventListener('click', () => {
      const points = state === 'forming' ? agents.map(a => a.textTarget) : agents.map(a => a.scatterTarget);
      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      points.forEach(p => {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
      });
      const center = new THREE.Vector3((minX+maxX)/2, 0, (minZ+maxZ)/2);
      const size = Math.max(maxX-minX, maxZ-minZ);
      const distance = size * 1.2;
      camera.position.set(center.x, distance, center.z + 0.001);
      controls.target.copy(center);
      controls.update();
    });

    // Reset View: resets to previous default view
    document.getElementById('btn-reset').addEventListener('click', resetCamera);

    window.addEventListener('keydown', (event) => {
      if (document.activeElement === textInput) return;
      if (event.code === 'Space') {
        event.preventDefault();
        resetCamera();
      }
    });

    // Initial camera: Previous default angle
    resetCamera();

    // ---------- SPATIAL GRID ----------
    const GRID_CELL = 2.0;
    const gridMap = new Map();

    function rebuildGrid() {
      gridMap.clear();
      for (let i = 0; i < agents.length; i++) {
        const p = agents[i].pos;
        const cx = Math.floor(p.x / GRID_CELL);
        const cz = Math.floor(p.z / GRID_CELL);
        const key = cx + '_' + cz;
        if (!gridMap.has(key)) gridMap.set(key, []);
        gridMap.get(key).push(i);
      }
    }

    // ---------- MATRIX HELPERS ----------
    const _rootMatrix = new THREE.Matrix4();
    const _tmpMatrix = new THREE.Matrix4();
    const _tmpQuat = new THREE.Quaternion();
    const _tmpScale = new THREE.Vector3(1, 1, 1);

    function updateInstance(part, index, matrix) {
      part.setMatrixAt(index, matrix);
    }

    // ---------- ANIMATION ----------
    const clock = new THREE.Clock();
    const tempVec = new THREE.Vector3();
    const separationVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      controls.update();
      rebuildGrid();

      for (let i = 0; i < agents.length; i++) {
        const agent = agents[i];
        const target = state === 'forming' ? agent.textTarget : agent.scatterTarget;
        const toTarget = tempVec.subVectors(target, agent.pos);
        const dist = toTarget.length();

        // Desired velocity (Arrive behavior)
        const desiredVel = new THREE.Vector3();
        if (dist > ARRIVAL_RADIUS) {
          desiredVel.copy(toTarget).normalize().multiplyScalar(MAX_SPEED * speedMultiplier);
        } else {
          const speed = (dist / ARRIVAL_RADIUS) * MAX_SPEED * speedMultiplier;
          desiredVel.copy(toTarget).normalize().multiplyScalar(speed);
        }

        // Separation
        separationVec.set(0, 0, 0);
        if (dist > 0.5) { // Only apply separation if not very close
          const cellX = Math.floor(agent.pos.x / GRID_CELL);
          const cellZ = Math.floor(agent.pos.z / GRID_CELL);
          const range = 1;
          for (let dx = -range; dx <= range; dx++) {
            for (let dz = -range; dz <= range; dz++) {
              const key = (cellX + dx) + '_' + (cellZ + dz);
              const cell = gridMap.get(key);
              if (cell) {
                for (const j of cell) {
                  if (j === i) continue;
                  const other = agents[j];
                  const diff = new THREE.Vector3().subVectors(agent.pos, other.pos);
                  const d = diff.length();
                  if (d < SEPARATION_RADIUS && d > 0.0001) {
                    diff.normalize();
                    separationVec.add(diff.multiplyScalar(1 / d));
                  }
                }
              }
            }
          }
          const sepWeight = SEPARATION_WEIGHT * Math.min(1.0, dist / 3.0);
          separationVec.multiplyScalar(sepWeight);
        }

        const steering = desiredVel.add(separationVec);
        if (steering.length() > MAX_SPEED * speedMultiplier) {
          steering.normalize().multiplyScalar(MAX_SPEED * speedMultiplier);
        }

        agent.vel.lerp(steering, 0.15);

        // Snap to target if very close and slow
        if (dist < 0.1 && agent.vel.length() < 0.05) {
          agent.pos.copy(target);
          agent.vel.set(0, 0, 0);
        } else {
          agent.pos.addScaledVector(agent.vel, delta);
        }

        if (agent.vel.lengthSq() > 0.001) {
          agent.rotY = Math.atan2(agent.vel.x, agent.vel.z);
        }

        const speedNorm = agent.vel.length() / (MAX_SPEED * speedMultiplier);
        const stride = Math.sin(time * 12 + agent.phase) * speedNorm;
        agent.pos.y = Math.abs(Math.sin(time * 12 + agent.phase)) * 0.08 * speedNorm;

        const damping = speedNorm > 0.1 ? 1 : 0.8;
        const leftHip = stride * 0.55 * damping;
        const rightHip = -stride * 0.55 * damping;
        const leftKnee = (stride > 0 ? stride * 0.5 : 0) * damping;
        const rightKnee = (stride < 0 ? -stride * 0.5 : 0) * damping;
        const leftShoulder = -stride * 0.45 * damping;
        const rightShoulder = stride * 0.45 * damping;
        const leftElbow = -0.2 - Math.abs(stride) * 0.25 * damping;
        const rightElbow = -0.2 - Math.abs(stride) * 0.25 * damping;

        _rootMatrix.compose(agent.pos, _tmpQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), agent.rotY), _tmpScale);

        _tmpMatrix.copy(_rootMatrix).multiply(new THREE.Matrix4().makeTranslation(0, 1.15, 0));
        updateInstance(parts.torso, i, _tmpMatrix);
        _tmpMatrix.copy(_rootMatrix).multiply(new THREE.Matrix4().makeTranslation(0, 0.75, 0));
        updateInstance(parts.pelvis, i, _tmpMatrix);
        _tmpMatrix.copy(_rootMatrix).multiply(new THREE.Matrix4().makeTranslation(0, 1.6, 0));
        updateInstance(parts.head, i, _tmpMatrix);

        const hairMatrix0 = _tmpMatrix.clone();
        const hairMatrix1 = _tmpMatrix.clone();
        hairMatrix0.multiply(new THREE.Matrix4().makeTranslation(0, 0.1, -0.02));
        hairMatrix1.multiply(new THREE.Matrix4().makeTranslation(0, 0.02, 0));
        if (agent.hairStyle === 0) {
          updateInstance(parts.hair0, i, hairMatrix0);
          updateInstance(parts.hair1, i, new THREE.Matrix4().makeScale(0,0,0));
        } else {
          updateInstance(parts.hair0, i, new THREE.Matrix4().makeScale(0,0,0));
          updateInstance(parts.hair1, i, hairMatrix1);
        }

        const shoulderOffsetL = new THREE.Matrix4().makeTranslation(-0.32, 1.4, 0);
        const shoulderRotL = new THREE.Matrix4().makeRotationX(leftShoulder);
        _tmpMatrix.copy(_rootMatrix).multiply(shoulderOffsetL).multiply(shoulderRotL);
        updateInstance(parts.leftUpperArm, i, _tmpMatrix);
        const elbowOffsetL = new THREE.Matrix4().makeTranslation(0, -0.3, 0);
        const elbowRotL = new THREE.Matrix4().makeRotationX(leftElbow);
        _tmpMatrix.copy(_rootMatrix).multiply(shoulderOffsetL).multiply(shoulderRotL).multiply(elbowOffsetL).multiply(elbowRotL);
        updateInstance(parts.leftLowerArm, i, _tmpMatrix);

        const shoulderOffsetR = new THREE.Matrix4().makeTranslation(0.32, 1.4, 0);
        const shoulderRotR = new THREE.Matrix4().makeRotationX(rightShoulder);
        _tmpMatrix.copy(_rootMatrix).multiply(shoulderOffsetR).multiply(shoulderRotR);
        updateInstance(parts.rightUpperArm, i, _tmpMatrix);
        const elbowOffsetR = new THREE.Matrix4().makeTranslation(0, -0.3, 0);
        const elbowRotR = new THREE.Matrix4().makeRotationX(rightElbow);
        _tmpMatrix.copy(_rootMatrix).multiply(shoulderOffsetR).multiply(shoulderRotR).multiply(elbowOffsetR).multiply(elbowRotR);
        updateInstance(parts.rightLowerArm, i, _tmpMatrix);

        const hipOffsetL = new THREE.Matrix4().makeTranslation(-0.15, 0.68, 0);
        const hipRotL = new THREE.Matrix4().makeRotationX(leftHip);
        _tmpMatrix.copy(_rootMatrix).multiply(hipOffsetL).multiply(hipRotL);
        updateInstance(parts.leftUpperLeg, i, _tmpMatrix);
        const kneeOffsetL = new THREE.Matrix4().makeTranslation(0, -0.32, 0);
        const kneeRotL = new THREE.Matrix4().makeRotationX(leftKnee);
        _tmpMatrix.copy(_rootMatrix).multiply(hipOffsetL).multiply(hipRotL).multiply(kneeOffsetL).multiply(kneeRotL);
        updateInstance(parts.leftLowerLeg, i, _tmpMatrix);
        const footOffsetL = new THREE.Matrix4().makeTranslation(0, -0.34, 0.05);
        _tmpMatrix.copy(_rootMatrix).multiply(hipOffsetL).multiply(hipRotL).multiply(kneeOffsetL).multiply(kneeRotL).multiply(footOffsetL);
        updateInstance(parts.leftFoot, i, _tmpMatrix);

        const hipOffsetR = new THREE.Matrix4().makeTranslation(0.15, 0.68, 0);
        const hipRotR = new THREE.Matrix4().makeRotationX(rightHip);
        _tmpMatrix.copy(_rootMatrix).multiply(hipOffsetR).multiply(hipRotR);
        updateInstance(parts.rightUpperLeg, i, _tmpMatrix);
        const kneeOffsetR = new THREE.Matrix4().makeTranslation(0, -0.32, 0);
        const kneeRotR = new THREE.Matrix4().makeRotationX(rightKnee);
        _tmpMatrix.copy(_rootMatrix).multiply(hipOffsetR).multiply(hipRotR).multiply(kneeOffsetR).multiply(kneeRotR);
        updateInstance(parts.rightLowerLeg, i, _tmpMatrix);
        const footOffsetR = new THREE.Matrix4().makeTranslation(0, -0.34, 0.05);
        _tmpMatrix.copy(_rootMatrix).multiply(hipOffsetR).multiply(hipRotR).multiply(kneeOffsetR).multiply(kneeRotR).multiply(footOffsetR);
        updateInstance(parts.rightFoot, i, _tmpMatrix);
      }

      for (const key in parts) {
        parts[key].instanceMatrix.needsUpdate = true;
        if (parts[key].instanceColor) parts[key].instanceColor.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
