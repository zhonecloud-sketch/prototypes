  <title>Digital Profile</title>

  <script>
    // replace() rather than assign() so Back skips this page instead of bouncing here.
    location.replace('profile2609/' + location.hash);
  </script>
  <style>
    /* Matches the profile's "Signal & Silicon" theme so the brief frame before
       the redirect reads as intentional rather than a white flash. */
    :root { --bg: #070b14; --ink: #e9eef7; --ink-2: #b7c2d4; --cyan: #37d1ff; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; gap: 10px; text-align: center;
      background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    a { color: var(--cyan); }
    small { color: var(--ink-2); font-size: 12.5px; }
  </style>
</head>
