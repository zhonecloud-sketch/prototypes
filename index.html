<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Digital profile — software &amp; test engineering leader.">
  <title>Digital Profile</title>
  <link rel="stylesheet" href="style.css?v=20260923c">
  <script src="lib/js-yaml.js"></script>
</head>
<body>
  <main id="app" aria-busy="true">
    <div class="boot">loading profile</div>
  </main>
  <script>
    // ES modules and fetch() are blocked on file:// — explain instead of failing silently.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div class="notice"><h2>Serve this folder over http</h2>' +
        '<p>Browsers block module scripts and <code>fetch()</code> on <code>file://</code>. From this folder run ' +
        '<code>python -m http.server 8000</code> and open <code>http://localhost:8000/</code>.</p></div>';
    }
  </script>
  <script type="module" src="js/main.js?v=20260923c"></script>
</body>
</html>
