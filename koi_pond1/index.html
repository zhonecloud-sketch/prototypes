<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koi Pond at Dusk</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05060c; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <script type="module">
    let threeUrl = '../lib/three.module.js';
    try {
      await import(threeUrl);
    } catch (error) {
      console.warn('Local Three.js failed to load. Trying the CDN.', error);
      threeUrl = 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';
    }

    const importMap = document.createElement('script');
    importMap.type = 'importmap';
    importMap.textContent = JSON.stringify({ imports: { three: threeUrl } });
    document.head.appendChild(importMap);
    await import('./js/main.js');
  </script>
</body>
</html>
